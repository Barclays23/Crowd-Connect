<!-- backend/src/templates/notificationGeneric.html -->
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Crowd Connect • {{HEADING}}</title>
      <meta name="color-scheme" content="light dark">
      <meta name="supported-color-schemes" content="light dark">
      <style type="text/css">
         body { margin:0; padding:0; background:#f7f7f7; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
         table { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
         img { border:0; display:block; }
         @media (prefers-color-scheme: dark) {
         body { background:#111827 !important; }
         .dark-card { background:#1f2937 !important; }
         .dark-text { color:#f9fafb !important; }
         .dark-muted { color:#d1d5db !important; }
         }
      </style>
   </head>

   <body style="margin:0;padding:0;background:#f7f7f7;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
         <tr>
            <td align="center" style="padding:24px 12px;">

               <table role="presentation" width="100%" style="max-width:600px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.10);">

                  <!-- Header -->
                  <tr>
                     <td style="background:linear-gradient(135deg, #ff6b6b 0%, #e63946 100%);padding:44px 40px 30px;text-align:center;">
                        <h1 style="color:#ffffff;margin:0;font-size:34px;font-weight:800;letter-spacing:-1px;">
                           Crowd<span style="opacity:0.92;">Connect</span>
                        </h1>
                     </td>
                  </tr>

                  <!-- Body -->
                  <tr>
                     <td class="dark-card" style="background:#ffffff;padding:44px 40px 50px;text-align:center;">

                        <h2 class="dark-text" style="color:#111827;margin:0 0 8px;font-size:24px;font-weight:700;">
                           Hi {{USER_NAME}},
                        </h2>

                        <h3 class="dark-text" style="color:#111827;margin:0 0 24px;font-size:20px;font-weight:600;">
                           {{HEADING}}
                        </h3>

                        <div class="dark-muted" style="color:#374151;font-size:16px;line-height:1.6;text-align:left;max-width:480px;margin:0 auto;">
                           {{{BODY_HTML}}}
                        </div>

                        {{#if CTA_LINK}}
                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin:36px auto 0;">
                           <tr>
                           <td style="border-radius:12px;background:#e63946;">
                              <a href="{{CTA_LINK}}" target="_blank"
                                 style="display:inline-block;padding:14px 40px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;">
                                 {{CTA_TEXT}}
                              </a>
                           </td>
                           </tr>
                        </table>
                        {{/if}}

                     </td>
                  </tr>

                  <!-- Footer -->
                  <tr>
                     <td style="background:#f9fafb;padding:35px 40px;text-align:center;border-top:1px solid #e5e7eb;">
                        <p style="margin:0;font-size:14px;color:#9ca3af;line-height:1.6;">
                           The Crowd Connect Team<br>
                           <a href="https://crowdconnect.app" style="color:#e63946;text-decoration:none;">crowdconnect.app</a> •
                           <a href="mailto:support@crowdconnect.app" style="color:#e63946;text-decoration:none;">support@crowdconnect.app</a>
                        </p>
                        <p style="margin:20px 0 0;font-size:12px;color:#9ca3af;">
                           © {{CURRENT_YEAR}} Crowd Connect. All rights reserved.
                        </p>
                     </td>
                  </tr>
               </table>

               <table role="presentation" width="100%" style="max-width:600px;margin:20px auto 0;">
                  <tr>
                     <td align="center" style="font-size:11px;color:#9ca3af;">
                        This is an automated message — please do not reply directly.
                     </td>
                  </tr>
               </table>

            </td>
         </tr>
      </table>
   </body>
</html>

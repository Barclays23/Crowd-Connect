# frontend/nginx.conf


# 1. HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name crowdconnect.life www.crowdconnect.life;
    return 301 https://$host$request_uri;
}


# 2. HTTPS Server - Encrypted traffic with SSL & WebSocket reverse proxy
server {
    listen 443 ssl;
    server_name crowdconnect.life www.crowdconnect.life;

    # Paths to the certificates generated by Certbot
    ssl_certificate /etc/letsencrypt/live/crowdconnect.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdconnect.life/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SPA Fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend for API calls (with WebSocket & WebRTC support)
    location /api/ {
        # NO trailing slash at the end of 5000 (PORT number)
        proxy_pass http://backend:5000;   # <-- Change this based on backend server PORT number

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Required for WebSocket (Socket.IO) & WebRTC signaling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # If Socket.IO uses its default path instead of /api/
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
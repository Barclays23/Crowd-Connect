# root/docker-compose.yml


version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend